<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">SCAMS &amp; FRAUDS</text>
  </g>

  <!-- Main Illustration Content -->
  
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Center Bank Column Facade &amp; Security Gate -->
      <path d="M -180 -120 L 0 -170 L 180 -120 L 180 -95 L -180 -95 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <rect x="-160" y="-95" width="30" height="150" rx="6" fill="#1e293b" stroke="#334155" />
      <rect x="-60" y="-95" width="30" height="150" rx="6" fill="#1e293b" stroke="#334155" />
      <rect x="30" y="-95" width="30" height="150" rx="6" fill="#1e293b" stroke="#334155" />
      <rect x="130" y="-95" width="30" height="150" rx="6" fill="#1e293b" stroke="#334155" />
      <rect x="-190" y="55" width="380" height="25" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

      <!-- Center Shield: Anti-Impersonation Check -->
      <g transform="translate(0, -5)">
        <path d="M 0 -65 L 55 -32 L 55 30 C 55 75 0 100 0 100 C 0 100 -55 75 -55 30 L -55 -32 Z" fill="url(#shieldSafeGrad)" stroke="#34d399" stroke-width="2.5" />
        <path d="M -16 12 L -4 24 L 20 -4" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Left Satellite: Fake Urgent SMS Blocked -->
      <g transform="translate(-240, -10)" filter="url(#softShadow)">
        <rect x="-65" y="-60" width="130" height="120" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <rect x="-45" y="-40" width="90" height="20" rx="6" fill="#7f1d1d" />
        <text x="0" y="-26" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">URGENT: BLOCKED</text>
        <line x1="-40" y1="-5" x2="20" y2="-5" stroke="#94a3b8" stroke-width="2" />
        <line x1="-40" y1="10" x2="35" y2="10" stroke="#94a3b8" stroke-width="2" />
        <circle cx="0" cy="34" r="14" fill="#ef4444" />
        <text x="0" y="39" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">✕</text>
      </g>

      <!-- Right Satellite: Never Share OTP Warning -->
      <g transform="translate(240, -10)" filter="url(#softShadow)">
        <rect x="-65" y="-60" width="130" height="120" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <circle cx="0" cy="-20" r="18" fill="#f59e0b" fill-opacity="0.2" />
        <rect x="-12" y="-26" width="24" height="20" rx="4" fill="#f59e0b" />
        <path d="M -7 -26 L -7 -32 A 7 7 0 0 1 7 -32 L 7 -26" fill="none" stroke="#f59e0b" stroke-width="2.5" />
        <text x="0" y="16" fill="#fef08a" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEVER SHARE</text>
        <text x="0" y="34" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">OTP / PIN</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">Bank Impersonation Scams</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>