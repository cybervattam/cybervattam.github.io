<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic & Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category & Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">CYBER HYGIENE</text>
  </g>

  <!-- Main Illustration Content -->
  
    <!-- Center Social Profile Card with Privacy Controls -->
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Main Profile Card -->
      <rect x="-170" y="-140" width="340" height="280" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Banner Header -->
      <path d="M -170 -60 L 170 -60" stroke="#334155" stroke-width="1.5" />
      <rect x="-170" y="-140" width="340" height="80" rx="24" fill="url(#shieldGrad)" />

      <!-- Avatar with Shield -->
      <g transform="translate(0, -60)">
        <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
        <circle cx="0" cy="-8" r="14" fill="#94a3b8" />
        <path d="M -22 24 C -22 8 22 8 22 24 Z" fill="#94a3b8" />
        <!-- Verified Check Badge -->
        <circle cx="26" cy="18" r="12" fill="#10b981" />
        <path d="M 21 18 L 25 22 L 31 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Privacy Toggle Controls Inside Card -->
      <g transform="translate(0, 45)">
        <!-- Toggle 1: Location Hidden -->
        <rect x="-130" y="-20" width="260" height="34" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="-105" cy="-3" r="7" fill="#ef4444" />
        <text x="-90" y="2" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Location Sharing: OFF</text>
        <rect x="85" y="-12" width="30" height="18" rx="9" fill="#334155" />
        <circle cx="94" cy="-3" r="6" fill="#94a3b8" />

        <!-- Toggle 2: Private Account -->
        <rect x="-130" y="24" width="260" height="34" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <circle cx="-105" cy="41" r="7" fill="#10b981" />
        <text x="-90" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Profile: PRIVATE</text>
        <rect x="85" y="32" width="30" height="18" rx="9" fill="#10b981" />
        <circle cx="106" cy="41" r="6" fill="#ffffff" />
      </g>

      <!-- Left Satellite: Block Fake Requests -->
      <g transform="translate(-230, -10)" filter="url(#softShadow)">
        <rect x="-45" y="-45" width="90" height="90" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <circle cx="0" cy="-6" r="14" fill="#64748b" />
        <path d="M -18 22 C -18 10 18 10 18 22 Z" fill="#64748b" />
        <circle cx="18" cy="18" r="10" fill="#ef4444" />
        <line x1="14" y1="14" x2="22" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <line x1="22" y1="14" x2="14" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Right Satellite: Golden Padlock -->
      <g transform="translate(230, -10)" filter="url(#softShadow)">
        <rect x="-45" y="-45" width="90" height="90" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <rect x="-16" y="-6" width="32" height="26" rx="5" fill="#38bdf8" />
        <path d="M -10 -6 L -10 -15 A 10 10 0 0 1 10 -15 L 10 -6" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">Social Media Safety</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>