<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic & Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category & Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">CYBER HYGIENE</text>
  </g>

  <!-- Main Illustration Content -->
  
    <!-- Center Web Browser & Global Radar Shield -->
    <g transform="translate(600, 320)" filter="url(#softShadow)">
      <!-- Outer Defensive Radar Rings -->
      <circle cx="0" cy="0" r="220" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
      <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
      <circle cx="0" cy="0" r="90" fill="#0369a1" fill-opacity="0.1" />

      <!-- Central Browser Window -->
      <rect x="-190" y="-120" width="380" height="240" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <!-- Browser Top Bar -->
      <path d="M -190 -85 L 190 -85" stroke="#334155" stroke-width="1.5" />
      <circle cx="-165" cy="-102" r="5" fill="#ef4444" />
      <circle cx="-148" cy="-102" r="5" fill="#f59e0b" />
      <circle cx="-131" cy="-102" r="5" fill="#10b981" />
      <!-- URL Bar with Green Padlock -->
      <rect x="-105" y="-112" width="220" height="20" rx="10" fill="#1e293b" />
      <path d="M -85 -105 L -85 -108 A 4 4 0 0 1 -77 -108 L -77 -105 M -87 -105 L -75 -105 L -75 -97 L -87 -97 Z" fill="none" stroke="#10b981" stroke-width="1.8" />
      <text x="-68" y="-98" fill="#10b981" font-family="monospace" font-size="10.5" font-weight="600">https://secure.web</text>

      <!-- Center Verified Shield -->
      <g transform="translate(0, 20)">
        <path d="M 0 -45 L 38 -25 L 38 15 C 38 42 0 60 0 60 C 0 60 -38 42 -38 15 L -38 -25 Z" fill="url(#shieldSafeGrad)" stroke="#34d399" stroke-width="2.5" />
        <path d="M -12 8 L -3 17 L 15 -3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Floating Security Badges -->
      <!-- Left: Firewall -->
      <g transform="translate(-230, -30)" filter="url(#softShadow)">
        <rect x="-45" y="-35" width="90" height="70" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
        <path d="M -20 -15 L 20 -15 M -20 0 L 20 0 M -20 15 L 20 15 M 0 -15 L 0 0 M -10 0 L -10 15 M 10 0 L 10 15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      </g>
      <!-- Right: Privacy Eye -->
      <g transform="translate(230, -30)" filter="url(#softShadow)">
        <rect x="-45" y="-35" width="90" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
        <path d="M -22 0 C -12 -12 12 -12 22 0 C 12 12 -12 12 -22 0 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" />
        <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">General Internet Safety</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>