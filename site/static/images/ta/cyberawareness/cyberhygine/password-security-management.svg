<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">சைபர் சுகாதாரம்</text>
  </g>

  <!-- Main Illustration Content -->
  
    <!-- Center Digital Vault &amp; Master Key -->
    <g transform="translate(600, 320)" filter="url(#softShadow)">
      <!-- Outer Heavy Vault Rim -->
      <circle cx="0" cy="0" r="180" fill="#0f172a" stroke="#334155" stroke-width="6" />
      <circle cx="0" cy="0" r="160" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
      <!-- Vault Bolts around perimeter -->
      <circle cx="0" cy="-145" r="7" fill="#64748b" />
      <circle cx="102" cy="-102" r="7" fill="#64748b" />
      <circle cx="145" cy="0" r="7" fill="#64748b" />
      <circle cx="102" cy="102" r="7" fill="#64748b" />
      <circle cx="0" cy="145" r="7" fill="#64748b" />
      <circle cx="-102" cy="102" r="7" fill="#64748b" />
      <circle cx="-145" cy="0" r="7" fill="#64748b" />
      <circle cx="-102" cy="-102" r="7" fill="#64748b" />

      <!-- Center Keyhole Crest -->
      <circle cx="0" cy="0" r="65" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" />
      <!-- Padlock in Vault Center -->
      <rect x="-24" y="-10" width="48" height="40" rx="8" fill="#38bdf8" />
      <path d="M -15 -10 L -15 -24 A 15 15 0 0 1 15 -24 L 15 -10" fill="none" stroke="#38bdf8" stroke-width="4.5" />
      <circle cx="0" cy="6" r="5" fill="#0f172a" />
      <path d="M 0 10 L 0 18" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

      <!-- Left Badge: Strong Passphrase Card -->
      <g transform="translate(-260, -30)" filter="url(#softShadow)">
        <rect x="-80" y="-35" width="160" height="70" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <text x="-60" y="-12" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">கடவுச்சொல் ஹாஷ்</text>
        <!-- Bullets -->
        <circle cx="-50" cy="12" r="4.5" fill="#10b981" />
        <circle cx="-32" cy="12" r="4.5" fill="#10b981" />
        <circle cx="-14" cy="12" r="4.5" fill="#10b981" />
        <circle cx="4" cy="12" r="4.5" fill="#10b981" />
        <circle cx="22" cy="12" r="4.5" fill="#10b981" />
        <circle cx="40" cy="12" r="4.5" fill="#10b981" />
        <circle cx="58" cy="12" r="4.5" fill="#10b981" />
      </g>

      <!-- Right Badge: 2FA Mobile Prompt -->
      <g transform="translate(260, -30)" filter="url(#softShadow)">
        <rect x="-65" y="-55" width="130" height="110" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <rect x="-20" y="-42" width="40" height="6" rx="3" fill="#475569" />
        <!-- 2FA Code Bubble -->
        <rect x="-45" y="-18" width="90" height="30" rx="8" fill="#0f172a" stroke="#0284c7" />
        <text x="0" y="2" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">9 4 2 - 8 1 5</text>
        <circle cx="0" cy="30" r="12" fill="#10b981" />
        <path d="M -5 30 L -1 34 L 5 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="520" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">கடவுச்சொல் பாதுகாப்பு மேலாண்மை</text>
    <circle cx="494" cy="24" r="6" fill="#10b981" />
  </g>
</svg>