<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">തട്ടിപ്പുകളും വഞ്ചനകളും</text>
  </g>

  <!-- Main Illustration Content -->
  
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Transfer Pipeline Flow -->
      <path d="M -220 0 L 220 0" stroke="#334155" stroke-width="28" stroke-linecap="round" />
      <path d="M -220 0 L 220 0" stroke="#ef4444" stroke-width="6" stroke-dasharray="14,14" />

      <!-- Left Origin: Criminal Account Node -->
      <g transform="translate(-180, 0)">
        <circle cx="0" cy="0" r="42" fill="#1e1b4b" stroke="#ef4444" stroke-width="2.5" />
        <text x="0" y="5" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">നിയമവിരുദ്ധ പണം</text>
      </g>

      <!-- Center Intermediary Node: The Trap Account Intercepted -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="65" fill="#0f172a" stroke="#ef4444" stroke-width="3" />
        <!-- Handcuffs / Compliance Lock -->
        <circle cx="-16" cy="-6" r="14" fill="none" stroke="#ef4444" stroke-width="3" />
        <circle cx="16" cy="-6" r="14" fill="none" stroke="#ef4444" stroke-width="3" />
        <line x1="-2" y1="-6" x2="2" y2="-6" stroke="#ef4444" stroke-width="4" />
        <text x="0" y="32" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ഗുരുതര കുറ്റകൃത്യം</text>
      </g>

      <!-- Right Destination: Frozen Output Node -->
      <g transform="translate(180, 0)">
        <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
        <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#64748b" />
        <text x="0" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">മരവിപ്പിച്ചു</text>
      </g>

      <!-- Overhead Caution Badge -->
      <g transform="translate(0, -110)">
        <rect x="-140" y="-20" width="280" height="40" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
        <text x="0" y="6" fill="#fef2f2" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">മറ്റുള്ളവർക്കായി പണം കൈമാറരുത്</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">മണി മ്യൂൾ അഴിമതികൾ</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>