<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">കുടുംബ സുരക്ഷ</text>
  </g>

  <!-- Main Illustration Content -->
  
    <!-- Center Workstation with Supportive Guidance Shield -->
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Supportive Cyber Shield Aura -->
      <path d="M 0 -160 L 140 -80 L 140 60 C 140 145 0 200 0 200 C 0 200 -140 145 -140 60 L -140 -80 Z" fill="#0369a1" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2" />

      <!-- Center Laptop Display -->
      <rect x="-140" y="-80" width="280" height="170" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <rect x="-125" y="-65" width="250" height="125" rx="8" fill="#090d16" />
      <!-- Base of Laptop -->
      <path d="M -175 90 L 175 90 L 150 115 L -150 115 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

      <!-- Screen: Family Shield &amp; Verified Protection -->
      <g transform="translate(0, -3)">
        <circle cx="0" cy="0" r="38" fill="url(#shieldSafeGrad)" />
        <path d="M -12 0 L -4 8 L 14 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Left Satellite: Deflected Fake Tech Support Popup -->
      <g transform="translate(-240, -10)" filter="url(#softShadow)">
        <rect x="-60" y="-55" width="120" height="110" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <circle cx="0" cy="-20" r="16" fill="#ef4444" />
        <text x="0" y="-14" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">!</text>
        <text x="0" y="10" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">വ്യാജ പോപ്പ്-അപ്പ്</text>
        <text x="0" y="26" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">തടഞ്ഞു</text>
      </g>

      <!-- Right Satellite: Verified Phone Call Filter -->
      <g transform="translate(240, -10)" filter="url(#softShadow)">
        <rect x="-60" y="-55" width="120" height="110" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <path d="M -12 -28 C -18 -28 -24 -22 -24 -16 C -24 0 -8 16 8 16 C 14 16 20 10 20 4 L 14 -2 L 8 4 C 2 0 -2 -4 -6 -10 L 0 -16 Z" fill="#10b981" />
        <text x="0" y="32" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">സ്ഥിരീകരിച്ച കോൾ</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">മുതിർന്നവർ (55+)</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>