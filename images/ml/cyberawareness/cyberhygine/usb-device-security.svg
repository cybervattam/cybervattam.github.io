<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">സൈബർ ശുചിത്വം</text>
  </g>

  <!-- Main Illustration Content -->
  
    <!-- Center USB Flash Drive &amp; Scan Radar -->
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Radial Scan Boundary -->
      <circle cx="0" cy="0" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
      <circle cx="0" cy="0" r="130" fill="#0369a1" fill-opacity="0.1" />

      <!-- USB Drive Body (Angled Perspective) -->
      <g transform="rotate(-30)">
        <!-- USB Metal Connector -->
        <rect x="-24" y="-140" width="48" height="60" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2" />
        <rect x="-15" y="-120" width="10" height="16" fill="#0f172a" />
        <rect x="5" y="-120" width="10" height="16" fill="#0f172a" />

        <!-- USB Casing -->
        <rect x="-35" y="-80" width="70" height="160" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
        <!-- Activity LED -->
        <circle cx="0" cy="-45" r="4" fill="#10b981" filter="url(#neonCyan)" />
        <!-- Grip Ridges -->
        <line x1="-18" y1="20" x2="18" y2="20" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
        <line x1="-18" y1="35" x2="18" y2="35" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
        <line x1="-18" y1="50" x2="18" y2="50" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Laser Scanner Beam Crossing USB -->
      <line x1="-160" y1="-30" x2="160" y2="-30" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#neonCyan)" />
      
      <!-- Left Shield: Autorun Blocked -->
      <g transform="translate(-230, 20)" filter="url(#softShadow)">
        <rect x="-50" y="-45" width="100" height="90" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <!-- Blocked Play Icon -->
        <polygon points="-8,-12 12,0 -8,12" fill="#ef4444" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="#ef4444" stroke-width="2.5" />
        <line x1="-18" y1="18" x2="18" y2="-18" stroke="#ef4444" stroke-width="2.5" />
        <text x="0" y="34" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ഓട്ടോറൺ: ഓഫ്</text>
      </g>

      <!-- Right Shield: Clean Scan Check -->
      <g transform="translate(230, 20)" filter="url(#softShadow)">
        <rect x="-50" y="-45" width="100" height="90" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <circle cx="0" cy="-6" r="20" fill="#10b981" />
        <path d="M -8 -6 L -2 0 L 8 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="0" y="34" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ഫയലുകൾ പരിശോധിച്ചു</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">USB ഉപകരണ സുരക്ഷ</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>