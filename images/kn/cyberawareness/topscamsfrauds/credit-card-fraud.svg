<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">ಹಗರಣಗಳು ಮತ್ತು ವಂಚನೆಗಳು</text>
  </g>

  <!-- Main Illustration Content -->
  
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- 3D Perspective Credit Card -->
      <rect x="-170" y="-105" width="340" height="210" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Magnetic Stripe / Accent Ribbon -->
      <path d="M -170 -40 L 170 -40" stroke="#0284c7" stroke-width="4" opacity="0.6" />
      
      <!-- Gold EMV Chip -->
      <rect x="-125" y="-15" width="55" height="42" rx="8" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />
      <line x1="-125" y1="6" x2="-70" y2="6" stroke="#92400e" stroke-width="1.5" />
      <line x1="-97" y1="-15" x2="-97" y2="27" stroke="#92400e" stroke-width="1.5" />

      <!-- Contactless Wave Symbol -->
      <path d="M -50 -5 A 14 14 0 0 1 -50 20 M -42 -12 A 22 22 0 0 1 -42 27 M -34 -19 A 30 30 0 0 1 -34 34" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

      <!-- Masked Card Numbers -->
      <text x="-125" y="65" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4">•••• •••• •••• 8492</text>

      <!-- Center-Right: RFID Protection Shield -->
      <g transform="translate(90, 5)">
        <path d="M 0 -50 L 42 -25 L 42 20 C 42 55 0 75 0 75 C 0 75 -42 55 -42 20 L -42 -25 Z" fill="url(#shieldSafeGrad)" stroke="#6ee7b7" stroke-width="2.5" />
        <path d="M -12 10 L -3 19 L 16 -3" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Left Satellite: Skimmer Detector Warning -->
      <g transform="translate(-240, 20)" filter="url(#softShadow)">
        <rect x="-55" y="-45" width="110" height="90" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
        <circle cx="0" cy="-8" r="18" fill="#ef4444" fill-opacity="0.2" />
        <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#ef4444" stroke-width="2.5" />
        <text x="0" y="24" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ಸ್ಕಿಮ್ಮರ್</text>
        <text x="0" y="36" fill="#ef4444" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ</text>
      </g>

      <!-- Right Satellite: CVV Lock -->
      <g transform="translate(240, 20)" filter="url(#softShadow)">
        <rect x="-55" y="-45" width="110" height="90" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <rect x="-14" y="-18" width="28" height="24" rx="4" fill="#38bdf8" />
        <path d="M -8 -18 L -8 -26 A 8 8 0 0 1 8 -26 L 8 -18" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <text x="0" y="24" fill="#93c5fd" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">CVV ಮರೆಮಾಡಲಾಗಿದೆ</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">ಕ್ರೆಡಿಟ್ ಕಾರ್ಡ್ ವಂಚನೆ</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>