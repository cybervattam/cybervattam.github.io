<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic &amp; Component Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="shieldSafeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#circuitGrid)" />

  <!-- Ambient Light Flares -->
  <circle cx="200" cy="180" r="280" fill="url(#glowCyan)" />
  <circle cx="1020" cy="500" r="320" fill="url(#glowCyan)" />

  <!-- Cyber Circuit Lines Decor -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" />
    <circle cx="80" cy="120" r="4" fill="#38bdf8" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
    
    <path d="M 1120 540 L 980 540 L 940 500 L 820 500" />
    <circle cx="1120" cy="540" r="4" fill="#38bdf8" />
    <circle cx="820" cy="500" r="4" fill="#38bdf8" />

    <path d="M 140 560 L 240 560 L 280 520" />
    <circle cx="140" cy="560" r="4" fill="#38bdf8" />

    <path d="M 1060 140 L 960 140 L 920 180" />
    <circle cx="1060" cy="140" r="4" fill="#38bdf8" />
  </g>

  <!-- Category &amp; Brand Header Pill -->
  <g transform="translate(60, 48)">
    <rect width="210" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#38bdf8" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">घोटाले और धोखाधड़ी</text>
  </g>

  <!-- Main Illustration Content -->
  
    <g transform="translate(600, 315)" filter="url(#softShadow)">
      <!-- Cyber Ocean Grid Background Waves -->
      <path d="M -260 90 Q -130 60 0 90 T 260 90" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4" />
      <path d="M -260 120 Q -130 90 0 120 T 260 120" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.3" />

      <!-- Digital Fishing Hook with Dangling Login Bait -->
      <path d="M 0 -170 L 0 -20 C 0 45 45 45 45 10 C 45 -10 32 -10 32 0" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
      <!-- Barbed Tip -->
      <polygon points="32,0 24,-8 28,6" fill="#ef4444" />

      <!-- Floating Fake Login Box Bait -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-45" width="130" height="90" rx="12" fill="#1e1b4b" stroke="#ef4444" stroke-width="2" />
        <rect x="-45" y="-28" width="90" height="16" rx="4" fill="#0f172a" />
        <text x="-40" y="-16" fill="#ef4444" font-family="monospace" font-size="9">user@fake.com</text>
        <rect x="-45" y="-4" width="90" height="16" rx="4" fill="#0f172a" />
        <text x="-40" y="8" fill="#64748b" font-family="monospace" font-size="9">••••••••</text>
        <rect x="-25" y="18" width="50" height="16" rx="8" fill="#ef4444" />
        <text x="0" y="30" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">लॉग इन</text>
      </g>

      <!-- Laser Shield Slicing the Hook Line -->
      <g transform="translate(-100, -30)">
        <path d="M 0 -70 L 60 -35 L 60 35 C 60 80 0 105 0 105 C 0 105 -60 80 -60 35 L -60 -35 Z" fill="url(#shieldSafeGrad)" stroke="#34d399" stroke-width="3" />
        <!-- Laser Beam Cutting Line -->
        <line x1="20" y1="10" x2="160" y2="-40" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#neonCyan)" />
        <path d="M -18 12 L -6 24 L 20 -2" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Left Satellite: Domain Verification -->
      <g transform="translate(-240, 20)" filter="url(#softShadow)">
        <rect x="-55" y="-45" width="110" height="90" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <circle cx="0" cy="-8" r="16" fill="#38bdf8" fill-opacity="0.2" />
        <path d="M -8 -8 L 8 -8 M -4 -12 L 0 -16 L 4 -12" stroke="#38bdf8" stroke-width="2" fill="none" />
        <text x="0" y="22" fill="#93c5fd" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">सटीक डोमेन</text>
        <text x="0" y="34" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">जांचें</text>
      </g>
    </g>

  <!-- Bottom Topic Title Badge -->
  <g transform="translate(60, 580)">
    <rect width="420" height="48" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <text x="24" y="30" fill="#f8fafc" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">फ़िशिंग</text>
    <circle cx="394" cy="24" r="6" fill="#10b981" />
  </g>
</svg>